# sample-web — INTERNAL variant.
#
# is_public = false: no public ingress. The workload still gets a
# cluster-internal Service (primary container exposes port 8080), so it
# is reachable in-cluster but not from the public internet — the
# counterpart to public.toml for the networking matrix row.
name = "sample-web"

[[workloads]]
name = "web"
kind = "deployment"
is_public = false
replicas = 1
cpu_request = "50m"
cpu_limit = "250m"
memory_request = "64Mi"
memory_limit = "128Mi"

  [[workloads.containers]]
  name = "app"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-web:main-latest"
  port = 8080

    [workloads.containers.env]
    LOG_LEVEL = "info"

    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 8080
